<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Timeline | Halidom</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cantata+One&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">
      <span class="logo-text">Halidom</span>
      <img class="logo-mark" src="images/logo-mark.svg" alt="">
    </a>
    <a class="header-link" href="about.html">About</a>
  </header>

  <div class="page-body">

    <nav class="sidebar">
      <ul class="nav-list">
        <li class="nav-item">
          <a class="nav-link" href="index.html">
            <img class="nav-icon" src="images/icon-home.svg" alt="Home">
            <span class="nav-label">Home</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-current" href="timeline.html">
            <span class="nav-circle">
              <img class="nav-icon" src="images/icon-timeline-active.svg" alt="Timeline">
            </span>
            <span class="nav-label">Timeline</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="map-directory.html">
            <img class="nav-icon" src="images/icon-map.svg" alt="Map">
            <span class="nav-label">Map</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="events.html">
            <img class="nav-icon" src="images/icon-events.svg" alt="Events">
            <span class="nav-label">Events</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="people.html">
            <img class="nav-icon" src="images/icon-people.svg" alt="People">
            <span class="nav-label">People</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="locations.html">
            <img class="nav-icon" src="images/icon-places.svg" alt="Places">
            <span class="nav-label">Places</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="stripe-dark"></div>
    <div class="stripe-pink"></div>

    <main class="timeline-main">
      <article>
        <!-- Events are static (no links or hover). Newest event first, because the list is drawn from the top of the page down -->
        <ul class="timeline">

          <li class="event event-stopping-halidoms-heart">
            <div class="event-content">
              <p class="event-label">Stopping<br>Halidom’s<br>Heart</p>
              <span class="event-dot"><span class="event-dot-center"></span></span>
            </div>
          </li>

          <li class="event event-hunt-for-the-king-of-fools">
            <div class="event-content">
              <span class="event-dot"><span class="event-dot-center"></span></span>
              <p class="event-label">Hunt for the<br>King of Fools</p>
            </div>
          </li>

          <li class="event event-siege-of-mistholt">
            <div class="event-content">
              <p class="event-label">Siege of<br>Mistholt</p>
              <span class="event-dot"><span class="event-dot-center"></span></span>
            </div>
          </li>

          <li class="event event-grand-masquerade">
            <div class="event-content">
              <span class="event-dot"><span class="event-dot-center"></span></span>
              <p class="event-label">The Grand<br>Masquerade</p>
            </div>
          </li>

          <li class="event event-great-hampton-bake-off">
            <div class="event-content">
              <p class="event-label">The Great<br>Hampton<br>Bake off</p>
              <span class="event-dot"><span class="event-dot-center"></span></span>
            </div>
          </li>

        </ul>
      </article>
    </main>

  </div>

</body>
</html>
