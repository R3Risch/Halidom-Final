<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Halidom</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cantata+One&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top pink bar: logo on the left, About link on the right -->
  <header class="site-header">
    <a class="logo" href="index.html">
      <span class="logo-text">Halidom</span>
      <img class="logo-knot" src="images/logo-knot.svg" alt="">
    </a>
    <nav class="header-nav">
      <ul class="header-nav-list">
        <li>
          <a class="about-link" href="about.html">About</a>
        </li>
      </ul>
    </nav>
  </header>

  <div class="page">

    <!-- Left sidebar: black icon strip + brown panel -->
    <nav class="sidebar">
      <ul class="nav-list">
        <li>
          <!-- "current" keeps the hover look on the page you are on -->
          <a class="nav-link current" href="index.html">
            <img class="nav-icon" src="images/home.svg" alt="Home">
            <img class="nav-icon-hover" src="images/home-hover.svg" alt="">
            <span class="nav-label">Home</span>
          </a>
        </li>
        <li>
          <a class="nav-link" href="timeline.html">
            <img class="nav-icon" src="images/timeline.svg" alt="Timeline">
            <img class="nav-icon-hover" src="images/timeline-hover.svg" alt="">
            <span class="nav-label">Timeline</span>
          </a>
        </li>
        <li>
          <a class="nav-link" href="map.html">
            <img class="nav-icon" src="images/map.svg" alt="Map">
            <img class="nav-icon-hover" src="images/map-hover.svg" alt="">
            <span class="nav-label">Map</span>
          </a>
        </li>
        <li>
          <a class="nav-link" href="events.html">
            <img class="nav-icon" src="images/events.svg" alt="Events">
            <img class="nav-icon-hover" src="images/events-hover.svg" alt="">
            <span class="nav-label">Events</span>
          </a>
        </li>
        <li>
          <a class="nav-link" href="people.html">
            <img class="nav-icon" src="images/people.svg" alt="People">
            <img class="nav-icon-hover" src="images/people-hover.svg" alt="">
            <span class="nav-label">People</span>
          </a>
        </li>
        <li>
          <a class="nav-link" href="places.html">
            <img class="nav-icon" src="images/places.svg" alt="Places">
            <img class="nav-icon-hover" src="images/places-hover.svg" alt="">
            <span class="nav-label">Places</span>
          </a>
        </li>
      </ul>
      <div class="nav-panel"></div>
    </nav>

    <!-- Main area: ribbons and sun are one background image -->
    <main class="main">
      <article class="home">
        <section class="hero">
          <div class="quote">
            <p class="quote-text">“We all live under the same sky, but we don't all have the same horizon.”</p>
            <p class="quote-author">Konrad Adenauer</p>
          </div>
        </section>
      </article>
    </main>

  </div>

</body>
</html>
